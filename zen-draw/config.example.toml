# Copy to $XDG_CONFIG_HOME/zen-draw/config.toml
# (or ~/.config/zen-draw/config.toml if XDG_CONFIG_HOME is unset; same on every OS).

# [keys] maps a command ID to key combinations. A key combination replaces all
# default key combinations of the command, and is removed from any other command
# that used it. An empty string removes all key combinations of the command.
# Unknown IDs are reported in the devtools console.
#
# Syntax: "p", "shift+p", "alt+1", "cmd+z,ctrl+z" (comma = alternatives).
# Modifiers: mod ctrl cmd meta alt option shift. "mod" is cmd on macOS and ctrl elsewhere.
# Key names: escape enter tab space delete backspace arrowup arrowdown arrowleft
# arrowright plus minus comma.
#
# Command IDs:
#   tool.<name>  selection rectangle diamond ellipse arrow line freedraw text image
#                eraser hand frame laser stickynote lasso bucketfill autoshape
#   host.open host.save host.saveAs  (default mod+o, mod+s, mod+shift+s)
#   ui.commandPalette ui.imageExport ui.toolLock
#   ui.toolRing ui.styleRing  (no default; hold the key, point, release)
#   editor actions by name, e.g. undo redo zoomIn zoomOut resetZoom group ungroup
#   duplicateSelection deleteSelectedElements toggleTheme gridMode

[keys]
# "tool.freedraw" = "d"
# "tool.laser" = ""
# "host.saveAs" = "mod+alt+s"

# [ring] sets the tool ring, which a right-drag opens at the pointer. Release in the
# direction of a slice to run its command; hold Shift on release to lock a tool.
# "items" (at most 8) are the slices; "more" (at most 8) is the sub-ring of the last
# slice. A missing list keeps the default.
[ring]
# items = ["tool.selection", "tool.rectangle", "tool.ellipse", "tool.diamond",
#          "tool.arrow", "tool.line", "tool.freedraw", "tool.text"]
# more = ["tool.eraser", "tool.hand", "tool.frame", "tool.image",
#         "tool.laser", "tool.stickynote", "tool.lasso", "tool.bucketfill"]
